name: XDP Shield and TCP Intelligence

on:
  pull_request:
    paths:
      - 'bpf/fluxvm_xdp_shield.bpf.c'
      - 'bpf/fluxvm_tcp_intel.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-xdp-shield-loader.c'
      - 'tools/fluxvm-shield-events.c'
      - 'tools/fluxvm-tcp-loader.c'
      - 'tools/fluxvm-tcp-events.c'
      - 'scripts/*network-intelligence*'
      - 'scripts/*xdp-tcp-intelligence*'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'
      - '.github/workflows/xdp-tcp-intelligence.yml'
  push:
    paths:
      - 'bpf/fluxvm_xdp_shield.bpf.c'
      - 'bpf/fluxvm_tcp_intel.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-xdp-shield-loader.c'
      - 'tools/fluxvm-shield-events.c'
      - 'tools/fluxvm-tcp-loader.c'
      - 'tools/fluxvm-tcp-events.c'
      - 'scripts/*network-intelligence*'
      - 'scripts/*xdp-tcp-intelligence*'

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluxvm
      - uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev pkg-config bpftool iproute2 iputils-ping python3-yaml libsystemd-dev libhivex-dev
      - name: Cargo tests
        working-directory: fluxvm
        run: cargo test -p fluxvm-intelligence
      - name: Build Set 6 BPF
        working-directory: fluxvm
        run: ./scripts/build-network-intelligence.sh /tmp/fluxvm-set6-bpf
      - name: Compile Set 6 helpers against real libbpf
        working-directory: fluxvm
        run: |
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-xdp-shield-loader.c -o /tmp/fluxvm-xdp-shield-loader $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-shield-events.c -o /tmp/fluxvm-shield-events $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-tcp-loader.c -o /tmp/fluxvm-tcp-loader $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-tcp-events.c -o /tmp/fluxvm-tcp-events $(pkg-config --cflags --libs libbpf)
      - name: Static gates
        working-directory: fluxvm
        run: ./scripts/test-xdp-tcp-intelligence-static.sh
      - name: Privileged veth/netns test
        if: ${{ vars.FLUXVM_EBPF_PRIVILEGED_CI == '1' }}
        working-directory: fluxvm
        run: sudo --preserve-env=PATH ./scripts/test-xdp-tcp-intelligence-host.sh
