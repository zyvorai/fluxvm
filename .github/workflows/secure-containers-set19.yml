name: secure-containers-set19
on:
  pull_request:
    paths:
      - "bpf/**"
      - "crates/fluxvm-network/**"
      - "crates/fluxvm-container-*/**"
      - "tools/fluxvm-policy-observer/**"
      - "controllers/fluxvm-networkpolicy-controller/**"
      - "scripts/**"
      - "docs/**"
jobs:
  rust-bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluxvm
      - uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt,clippy"}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev \
            linux-tools-common linux-tools-generic libsystemd-dev libhivex-dev pkg-config
          sudo apt-get install -y "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-azure || true
          bpftool version || echo 'bpftool still stubbed for this kernel; build scripts may fall back'
      - name: cargo fmt
        working-directory: fluxvm
        run: cargo fmt --all -- --check
      - name: cargo test
        working-directory: fluxvm
        run: cargo test --locked -p fluxvm-network -p fluxvm-container-protocol -p fluxvm-container-agent -p fluxvm-containerd-shim
      - name: cargo clippy
        working-directory: fluxvm
        run: cargo clippy --locked -p fluxvm-network -p fluxvm-container-protocol -p fluxvm-container-agent -p fluxvm-containerd-shim -- -D warnings
      - name: build host eBPF
        working-directory: fluxvm
        run: scripts/build-ebpf.sh
      - name: build guest eBPF
        working-directory: fluxvm
        run: scripts/build-ebpf-guest.sh
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: cd controllers/fluxvm-networkpolicy-controller && go test -count=1 ./... && go test -race -count=1 ./... && go vet ./...
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: |
          cd tools/fluxvm-policy-observer
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
