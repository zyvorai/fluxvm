name: Secure Containers NetworkPolicy Controller

on:
  pull_request:
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'bpf/fluxvm_pod_policy.bpf.h'
      - 'bpf/fluxvm_pod_ingress.bpf.c'
      - 'bpf/fluxvm_tc.bpf.c'
      - 'crates/fluxvm-network/src/dataplane.rs'
      - 'crates/fluxvm-network/src/ebpf.rs'
      - 'scripts/build-ebpf.sh'
      - 'docs/secure-containers-set14.md'
      - '.github/workflows/secure-containers-networkpolicy-controller.yml'
  push:
    branches: [main]
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'bpf/fluxvm_pod_policy.bpf.h'
      - 'bpf/fluxvm_pod_ingress.bpf.c'
      - 'bpf/fluxvm_tc.bpf.c'
      - 'crates/fluxvm-network/src/dataplane.rs'
      - 'crates/fluxvm-network/src/ebpf.rs'
      - 'scripts/build-ebpf.sh'
      - 'docs/secure-containers-set14.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controllers/fluxvm-networkpolicy-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: controllers/fluxvm-networkpolicy-controller/go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -X main.version=set14' -o /tmp/controller-amd64 ./cmd/fluxvm-networkpolicy-controller
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w -X main.version=set14' -o /tmp/controller-arm64 ./cmd/fluxvm-networkpolicy-controller
  dataplane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fluxvm
        uses: actions/checkout@v4
        with:
          path: fluxvm
      - name: Checkout guestkit sibling dependency
        uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install eBPF build deps
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev linux-tools-common linux-tools-generic iproute2 libsystemd-dev libhivex-dev pkg-config
      - name: Rust format/check/tests
        working-directory: fluxvm
        run: |
          ./scripts/ci-fmt-check.sh
          cargo test --locked -p fluxvm-network
          cargo check --locked -p fluxvm-core -p fluxvm-network -p fluxvm-api
          cargo clippy --locked -p fluxvm-network -- -D warnings
      - name: Build eBPF objects
        working-directory: fluxvm
        run: ./scripts/build-ebpf.sh /tmp/fluxvm-bpf
      - name: Verify Set 14 objects
        run: |
          test -s /tmp/fluxvm-bpf/fluxvm_tc.bpf.o
          test -s /tmp/fluxvm-bpf/fluxvm_pod_ingress.bpf.o
          bpftool btf dump file /tmp/fluxvm-bpf/fluxvm_tc.bpf.o format raw | grep -q fluxvm_pod_rule
