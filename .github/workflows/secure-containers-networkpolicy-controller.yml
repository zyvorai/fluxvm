name: Secure Containers NetworkPolicy Controller

on:
  pull_request:
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'docs/secure-containers-set13.md'
      - '.github/workflows/secure-containers-networkpolicy-controller.yml'
  push:
    branches: [main]
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'docs/secure-containers-set13.md'
      - '.github/workflows/secure-containers-networkpolicy-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controllers/fluxvm-networkpolicy-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: controllers/fluxvm-networkpolicy-controller/go.mod
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Static Linux build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/fluxvm-networkpolicy-controller ./cmd/fluxvm-networkpolicy-controller
