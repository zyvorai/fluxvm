name: tcx-drop-detective
on:
  pull_request:
    paths:
      - 'crates/fluxvm-network/src/ebpf.rs'
      - 'crates/fluxvm-network/src/tcx.rs'
      - 'crates/fluxvm-network/src/lib.rs'
      - 'crates/fluxvm-intelligence/**'
      - 'crates/fluxvm-cli/**'
      - 'tools/fluxvm-tcx.c'
      - 'scripts/*tcx*'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'
      - '.github/workflows/tcx-drop-detective.yml'
  push:
    branches: [main]
    paths:
      - 'crates/fluxvm-network/src/ebpf.rs'
      - 'crates/fluxvm-network/src/tcx.rs'
      - 'crates/fluxvm-network/src/lib.rs'
      - 'crates/fluxvm-intelligence/**'
      - 'crates/fluxvm-cli/**'
      - 'tools/fluxvm-tcx.c'
      - 'scripts/*tcx*'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'
      - '.github/workflows/tcx-drop-detective.yml'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fluxvm
        uses: actions/checkout@v4
        with:
          path: fluxvm
      - name: Checkout guestkit sibling dependency
        uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev pkg-config libsystemd-dev libhivex-dev iproute2
      - name: Rust tests
        working-directory: fluxvm
        run: cargo test -p fluxvm-network -p fluxvm-intelligence -p fluxvm-cli
      - name: Compile TCX helper
        working-directory: fluxvm
        run: cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-tcx.c -o /tmp/fluxvm-tcx $(pkg-config --cflags --libs libbpf)
      - name: Build eBPF objects
        working-directory: fluxvm
        run: ./scripts/build-ebpf.sh
      - name: Static gates
        working-directory: fluxvm
        run: ./scripts/test-tcx-drop-detective-static.sh
