# Publish ghcr.io/zyvorai/fluxvm (includes fluxvm, fluxvm-kube, fluxvm-microvm).
# Manual or on version tags. Requires packages:write (GITHUB_TOKEN).
name: publish-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.1.0 or latest)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fluxvm
        uses: actions/checkout@v4
        with:
          path: fluxvm

      - name: Checkout guestkit
        uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/zyvorai/fluxvm:${TAG},ghcr.io/zyvorai/fluxvm:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fluxvm
          build-contexts: guestkit=guestkit
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
