# FLUXVM_SECURE_CONTAINERS_SET17
name: secure-containers-set17-rule-telemetry

on:
  pull_request:
    paths:
      - 'bpf/**'
      - 'crates/fluxvm-network/**'
      - 'tools/fluxvm-policy-observer/**'
      - 'scripts/test-networkpolicy-stateful-set17.sh'
      - 'docs/secure-containers-set17.md'
      - '.github/workflows/secure-containers-set17-rule-telemetry.yml'
  workflow_dispatch:

jobs:
  observer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fluxvm-policy-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/fluxvm-policy-observer/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go test -count=1 -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/fluxvm-policy-observer
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/fluxvm-policy-observer

  dataplane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev bpftool iproute2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p fluxvm-network
      - run: cargo clippy --locked -p fluxvm-network -- -D warnings
      - run: ./scripts/build-ebpf.sh /tmp/fluxvm-bpf
      - run: test -s /tmp/fluxvm-bpf/fluxvm_tc.bpf.o && test -s /tmp/fluxvm-bpf/fluxvm_pod_ingress.bpf.o
      - name: Probe kernel BPF availability
        run: |
          set -e
          if ! sudo bpftool feature probe kernel >/dev/null 2>&1; then
            echo 'kernel BPF verifier unavailable on this runner; build gate already passed'
            exit 0
          fi
          echo 'BPF verifier is available; object loading remains covered by the project smoke test on privileged lab runners.'
      - run: bash -n scripts/test-networkpolicy-stateful-set17.sh
