name: Memory and Boot Profiler

on:
  pull_request:
    paths:
      - 'bpf/fluxvm_memprof.bpf.c'
      - 'crates/fluxvm-intelligence/src/memprof.rs'
      - 'crates/fluxvm-intelligence/src/bin/fluxvm-memprof.rs'
      - 'crates/fluxvm-intelligence/src/lib.rs'
      - 'tools/fluxvm-memprof-loader.c'
      - 'tools/fluxvm-memprof-events.c'
      - 'scripts/*memory-profiler*'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'
      - 'packaging/systemd/fluxvm-memprof.service'
      - '.github/workflows/memory-boot-profiler.yml'
  push:
    paths:
      - 'bpf/fluxvm_memprof.bpf.c'
      - 'crates/fluxvm-intelligence/src/memprof.rs'
      - 'crates/fluxvm-intelligence/src/bin/fluxvm-memprof.rs'
      - 'tools/fluxvm-memprof-loader.c'
      - 'tools/fluxvm-memprof-events.c'
      - 'scripts/*memory-profiler*'

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluxvm
      - uses: actions/checkout@v4
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev pkg-config linux-tools-common linux-tools-generic python3-yaml libsystemd-dev libhivex-dev
      - name: Cargo tests
        working-directory: fluxvm
        run: cargo test -p fluxvm-intelligence
      - name: Build Set 7 BPF
        working-directory: fluxvm
        run: ./scripts/build-memory-profiler.sh /tmp/fluxvm-set7-bpf
      - name: Compile Set 7 helpers against real libbpf
        working-directory: fluxvm
        run: |
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-memprof-loader.c -o /tmp/fluxvm-memprof-loader $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-memprof-events.c -o /tmp/fluxvm-memprof-events $(pkg-config --cflags --libs libbpf)
      - name: Static gates
        working-directory: fluxvm
        run: ./scripts/test-memory-profiler-static.sh
      - name: Privileged memory attribution test
        if: ${{ vars.FLUXVM_EBPF_PRIVILEGED_CI == '1' }}
        working-directory: fluxvm
        run: sudo --preserve-env=PATH ./scripts/test-memory-profiler-host.sh
