#
# Standalone scrape config for Prometheus (no Operator). Drop into
# prometheus.yml scrape_configs, or use with --config.file fragment.
#
#   - job_name: fluxvm-microvm
#     … include this file via scrape_config_files / file_sd
scrape_configs:
  - job_name: fluxvm-microvm
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "127.0.0.1:9108"
        labels:
          service: fluxvm-microvm
  - job_name: fluxvm-policy-observer
    metrics_path: /metrics
    scrape_interval: 15s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [kube-system]
        selectors:
          - role: pod
            label: "app.kubernetes.io/name=fluxvm-policy-observer"
