# Create before applying node-agent.yaml (token for loopback fluxvm serve).
#   kubectl -n fluxvm-system create secret generic fluxvm-microvm-token \
#     --from-literal=token="YOUR_FLUXVM_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
# Or apply this file after replacing REPLACE_ME.
apiVersion: v1
kind: Secret
metadata:
  name: fluxvm-microvm-token
  namespace: fluxvm-system
type: Opaque
stringData:
  token: REPLACE_ME
