#
# Prometheus scrape for fluxvm-microvm schedule→Running histograms
# (MICROVM_METRICS_ADDR, default :9108). Pair with node-agent hostNetwork.
apiVersion: v1
kind: Service
metadata:
  name: fluxvm-microvm-metrics
  namespace: fluxvm-system
  labels:
    app: fluxvm-microvm-node
    app.kubernetes.io/name: fluxvm-microvm
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
  selector:
    app: fluxvm-microvm-node
---
# Optional Prometheus Operator integration. Vanilla Prometheus can instead
# scrape pods with the prometheus.io/* annotations on the DaemonSet.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluxvm-microvm
  namespace: fluxvm-system
  labels:
    app.kubernetes.io/name: fluxvm-microvm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxvm-microvm
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
