# Merge into /etc/containerd/config.toml (containerd 1.x/CRI plugin layout).
# Restart containerd after changing the configuration.

[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.fluxvm]
  runtime_type = "io.containerd.fluxvm.v2"
  privileged_without_host_devices = false
  # Leave sandboxer at containerd's default ("podsandbox"). sandboxer="shim"
  # needs containerd.runtime.sandbox.v1.Sandbox on the shim, which FluxVM does
  # not implement yet.

[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.fluxvm.options]
  BinaryName = "containerd-shim-fluxvm-v2"
