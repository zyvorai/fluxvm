<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="FluxVM — Run real VMs with a real API. One Rust control plane for Firecracker, Cloud Hypervisor, QEMU/KVM and the FluxVM hypervisor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="glow" cx="1000" cy="320" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a15" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff5a15" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff5a15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="120" cy="620" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a15" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff5a15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#cc420a"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a15"/>
      <stop offset="1" stop-color="#ff5a15" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#ff5a15"/>

  <!-- brand lockup -->
  <rect x="80" y="70" width="80" height="80" rx="19" fill="url(#mark)"/>
  <path d="M100.5 88 139.5 88 100.5 132 139.5 132" fill="none" stroke="#ffffff"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="182" y="124" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="52" font-weight="700" fill="#f5f5f5" letter-spacing="-1">FluxVM</text>

  <!-- headline -->
  <text font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="66" font-weight="700"
        fill="#ffffff" letter-spacing="-1.5">
    <tspan x="78" y="262">Run real VMs</tspan>
    <tspan x="78" y="338">with a <tspan fill="#ff6a2a">real API.</tspan></tspan>
  </text>

  <!-- sub -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" fill="#a1a1a8">
    <text x="80" y="396">One Rust control plane, one REST API.</text>
    <text x="80" y="432">No libvirtd. No XML.</text>
  </g>

  <!-- proof chips -->
  <g font-family="'Menlo','JetBrains Mono',monospace" font-size="19" font-weight="700" fill="#ececee">
    <rect x="80" y="486" width="276" height="48" rx="24" fill="#1a1a1d" stroke="#ff5a15" stroke-opacity="0.55"/>
    <circle cx="106" cy="510" r="6" fill="#ff5a15"/>
    <text x="122" y="516">Network Fabric GA</text>

    <rect x="370" y="486" width="164" height="48" rx="24" fill="#1a1a1d" stroke="#34343b"/>
    <text x="394" y="516">Apache-2.0</text>

    <rect x="548" y="486" width="266" height="48" rx="24" fill="#1a1a1d" stroke="#34343b"/>
    <text x="572" y="516">k3s + 2-host tested</text>
  </g>

  <!-- diagram: one API fans out to four VMMs -->
  <g>
    <!-- wires -->
    <g fill="none" stroke="url(#wire)" stroke-width="3" stroke-linecap="round">
      <path d="M890 320 C 915 320, 915 170, 938 170"/>
      <path d="M890 320 C 915 320, 915 266, 938 266"/>
      <path d="M890 320 C 915 320, 915 374, 938 374"/>
      <path d="M890 320 C 915 320, 915 470, 938 470"/>
    </g>
    <g fill="#ff5a15">
      <circle cx="890" cy="320" r="6"/>
      <circle cx="938" cy="170" r="5"/>
      <circle cx="938" cy="266" r="5"/>
      <circle cx="938" cy="374" r="5"/>
      <circle cx="938" cy="470" r="5"/>
    </g>

    <!-- API node -->
    <rect x="700" y="266" width="190" height="108" rx="22" fill="url(#api)"/>
    <rect x="700" y="266" width="190" height="108" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="795" y="311" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="30" font-weight="700" fill="#ffffff">REST API</text>
    <text x="795" y="344" text-anchor="middle" font-family="'Menlo','JetBrains Mono',monospace"
          font-size="17" fill="#ffe4d6">fluxctl serve</text>

    <!-- backend nodes -->
    <g font-family="'Menlo','JetBrains Mono',monospace">
      <rect x="946" y="138" width="254" height="64" rx="16" fill="#17171a" stroke="#34343b"/>
      <text x="968" y="167" font-size="21" font-weight="700" fill="#f2f2f4">Firecracker</text>
      <text x="968" y="189" font-size="14" fill="#87878f">microVM · jailer</text>

      <rect x="946" y="234" width="254" height="64" rx="16" fill="#17171a" stroke="#34343b"/>
      <text x="968" y="263" font-size="21" font-weight="700" fill="#f2f2f4">Cloud Hypervisor</text>
      <text x="968" y="285" font-size="14" fill="#87878f">Rust VMM</text>

      <rect x="946" y="342" width="254" height="64" rx="16" fill="#17171a" stroke="#34343b"/>
      <text x="968" y="371" font-size="21" font-weight="700" fill="#f2f2f4">QEMU / KVM</text>
      <text x="968" y="393" font-size="14" fill="#87878f">qcow2 · QMP</text>

      <rect x="946" y="438" width="254" height="64" rx="16" fill="#17171a" stroke="#ff5a15" stroke-opacity="0.7"/>
      <text x="968" y="467" font-size="21" font-weight="700" fill="#ff8a4d">FluxVM hypervisor</text>
      <text x="968" y="489" font-size="14" fill="#87878f">snapshots · sandboxes</text>
    </g>
  </g>

  <!-- footer -->
  <text x="1200" y="574" text-anchor="end" font-family="'Menlo','JetBrains Mono',monospace"
        font-size="17" fill="#71717a">github.com/zyvorai/fluxvm</text>
  <text x="1200" y="604" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="26" font-weight="700" fill="#ff5a15">zyvor.dev</text>
  <text x="80" y="596" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18"
        fill="#71717a">Secure, isolated VMs on Linux · Host-local libvirt replacement</text>
</svg>
