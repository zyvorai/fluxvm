<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FluxVM hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  fluxvm-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>VM control plane</span></div>
  <div class="word">FluxVM</div>
  <div class="tag">Run real VMs.<br><em>With a real API.</em></div>
  <div class="lede">One Rust control plane and REST API for Firecracker, Cloud Hypervisor, QEMU/KVM and its own KVM hypervisor. No libvirtd, no XML.</div>
  <div class="stats"><div class="stat"><b>4</b><span>VM backends</span></div><div class="stat"><b>24</b><span>Rust crates</span></div><div class="stat"><b>3</b><span>SDKs: Py/Go/TS</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/zyvor-fluxvm</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// FluxVM: dipole flux around one control-plane core. The four VM backends ride on the field lines.
var C = Z.c;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="fxGl" filterUnits="userSpaceOnUse" x="-50" y="-50" width="780" height="730"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="fxSf" filterUnits="userSpaceOnUse" x="-50" y="-50" width="780" height="730"><feGaussianBlur stdDeviation="16"/></filter>' +
  '<radialGradient id="fxCore" cx=".4" cy=".35"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#9fd8ff"/><stop offset=".7" stop-color="#2997ff"/><stop offset="1" stop-color="#0a3a7a"/></radialGradient>' +
  '<radialGradient id="fxHalo"><stop offset="0" stop-color="#2997ff" stop-opacity=".55"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="fxLine" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="540"><stop offset="0" stop-color="#64d2ff"/><stop offset=".5" stop-color="#2997ff"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient>';

var cx = 380, cy = 312, SY = 1.55, rCore = 34;
function fieldPath(L, side) {
  var d = '', started = false;
  for (var t = 2; t <= 178; t += 1.5) {
    var th = t * Math.PI / 180, r = L * Math.sin(th) * Math.sin(th);
    if (r < rCore + 6) { started = false; continue; }
    var x = cx + side * r * Math.sin(th), y = cy - SY * r * Math.cos(th);
    d += (started ? ' L' : ' M') + x.toFixed(1) + ',' + y.toFixed(1);
    started = true;
  }
  return d;
}
Z.el('circle', { cx: cx, cy: cy, r: 230, fill: 'url(#fxHalo)', opacity: .45 });

// field lines: faint many, a few bright
var Ls = [70, 92, 116, 142, 170, 200, 232, 262];
var paths = {};
Ls.forEach(function (L, k) {
  [-1, 1].forEach(function (side) {
    var d = fieldPath(L, side), bright = (k === 5 && side > 0) || (k === 4 && side < 0) || (k === 6 && side < 0) || (k === 7 && side > 0);
    Z.el('path', { d: d, fill: 'none', stroke: 'url(#fxLine)', 'stroke-width': bright ? 2 : 1.1, opacity: bright ? .9 : (.22 + k * .04), filter: bright ? 'url(#fxGl)' : null });
    paths[L + ':' + side] = Z.el('path', { d: d, fill: 'none', stroke: 'none' });
  });
});
// open polar lines near the axis
for (var k = -2; k <= 2; k++) {
  if (!k) continue;
  var x0 = cx + k * 9;
  Z.el('path', { d: 'M' + x0 + ',' + (cy - rCore - 8) + ' C' + (x0 + k * 6) + ',' + (cy - 140) + ' ' + (x0 + k * 30) + ',' + (cy - 220) + ' ' + (x0 + k * 60) + ',' + 40, fill: 'none', stroke: C.cyan, 'stroke-width': 1, opacity: .25 });
  Z.el('path', { d: 'M' + x0 + ',' + (cy + rCore + 8) + ' C' + (x0 + k * 6) + ',' + (cy + 140) + ' ' + (x0 + k * 30) + ',' + (cy + 220) + ' ' + (x0 + k * 60) + ',' + 590, fill: 'none', stroke: C.indigo, 'stroke-width': 1, opacity: .25 });
}
// flux particles drifting along lines
Ls.forEach(function (L) {
  [-1, 1].forEach(function (side) {
    var p = paths[L + ':' + side], len = p.getTotalLength();
    for (var n = 0; n < 4; n++) {
      var pt = p.getPointAtLength(Z.rnd() * len);
      Z.el('circle', { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1), r: (0.8 + Z.rnd() * 1.4).toFixed(2), fill: '#cfe9ff', opacity: (.25 + Z.rnd() * .5).toFixed(2) });
    }
  });
});

// core
Z.el('circle', { cx: cx, cy: cy, r: 60, fill: '#2997ff', opacity: .35, filter: 'url(#fxSf)' });
Z.el('circle', { cx: cx, cy: cy, r: rCore, fill: 'url(#fxCore)', filter: 'url(#fxGl)' });
Z.el('circle', { cx: cx, cy: cy, r: rCore + 7, fill: 'none', stroke: 'rgba(160,215,255,.5)', 'stroke-width': 1, 'stroke-dasharray': '2 4' });
Z.el('line', { x1: cx, y1: cy - rCore - 18, x2: cx, y2: cy + rCore + 18, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 1 });

// backends sitting on the field lines
var nodes = [
  { L: 170, side: -1, t: 55, n: 'Firecracker', c: C.cyan, up: true },
  { L: 262, side: 1, t: 60, n: 'Cloud Hypervisor', c: C.teal, up: true },
  { L: 232, side: -1, t: 128, n: 'QEMU/KVM', c: C.signal, up: false },
  { L: 200, side: 1, t: 128, n: 'FluxVM hypervisor', c: C.violet, up: false }
];
nodes.forEach(function (nd) {
  var th = nd.t * Math.PI / 180, r = nd.L * Math.sin(th) * Math.sin(th);
  var x = cx + nd.side * r * Math.sin(th), y = cy - SY * r * Math.cos(th);
  Z.el('circle', { cx: x, cy: y, r: 20, fill: nd.c, opacity: .18, filter: 'url(#fxSf)' });
  Z.el('rect', { x: x - 11, y: y - 11, width: 22, height: 22, rx: 6, fill: '#06101c', stroke: nd.c, 'stroke-width': 2, filter: 'url(#fxGl)', transform: 'rotate(45 ' + x + ' ' + y + ')' });
  Z.el('circle', { cx: x, cy: y, r: 3.5, fill: '#fff' });
  Z.label(x, y + (nd.up ? -27 : 27), nd.n, '', 'color:#e5e5ea;font-size:12px;text-shadow:0 0 6px #05080e,0 0 3px #05080e');
});

Z.label(cx, cy + rCore + 34, '<b>control plane</b><span>one REST API</span>', 'box');
Z.label(cx, 48, 'no libvirtd &middot; no XML', 'chip');
})();
</script>
</body>
</html>
