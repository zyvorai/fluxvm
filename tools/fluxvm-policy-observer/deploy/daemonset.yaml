apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxvm-policy-observer
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluxvm-policy-observer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fluxvm-policy-observer
    app.kubernetes.io/part-of: fluxvm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxvm-policy-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxvm-policy-observer
        app.kubernetes.io/part-of: fluxvm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: fluxvm-policy-observer
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: observer
          image: ghcr.io/zyvorai/fluxvm-policy-observer:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:9091
            - --pin-root=/sys/fs/bpf/fluxvm
            - --meta-root=/run/fluxvm/ebpf/vms
            - --interval=5s
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "NET_ADMIN", "SYS_RESOURCE"]
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf/fluxvm
              readOnly: true
            - name: metadata
              mountPath: /run/fluxvm/ebpf/vms
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf/fluxvm
            type: DirectoryOrCreate
        - name: metadata
          hostPath:
            path: /run/fluxvm/ebpf/vms
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: fluxvm-policy-observer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fluxvm-policy-observer
spec:
  selector:
    app.kubernetes.io/name: fluxvm-policy-observer
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
