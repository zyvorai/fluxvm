<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">FluxVM Mac cloud</title>
  <desc id="d">A FluxVM control plane (fluxctl, REST API, MCP, fleet scheduler) placing virtual machines on two Mac Studios and two Mac minis linked by Thunderbolt 5 and 10 GbE. Each Mac runs vz guests on Apple Virtualization.framework: a macOS guest, an agent sandbox, a container sandbox and a Debian guest with Rosetta.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="95%">
      <stop offset="0" stop-color="#10345c"/>
      <stop offset=".45" stop-color="#05101f"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="cloudEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#bf5af2" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f5"/>
      <stop offset=".55" stop-color="#d1d1d6"/>
      <stop offset="1" stop-color="#a7a7ad"/>
    </linearGradient>
    <linearGradient id="aluTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdce0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3c8c"/>
      <stop offset=".35" stop-color="#5e5ce6"/>
      <stop offset=".7" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
    .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 14; animation: flow 1.1s linear infinite; }
    .wire { fill: none; stroke-width: 1.5; opacity: .35; }
    .link { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; animation: flow 1.6s linear infinite; }
    .bob { animation: bob 7s ease-in-out infinite; }
    .b2 { animation-delay: -1.8s; } .b3 { animation-delay: -3.6s; } .b4 { animation-delay: -5.2s; }
    .led { animation: pulse 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .link, .bob, .led, .cursor { animation: none; } }
  </style>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="800" cy="130" rx="520" ry="150" fill="url(#glow)"/>

  <!-- Control plane cloud -->
  <g>
    <path d="M470 212 C415 212 398 168 432 146 C420 104 468 80 512 96 C532 50 604 34 652 62 C694 20 792 14 832 56 C872 24 962 30 982 76 C1034 56 1104 78 1102 118 C1152 118 1184 164 1160 194 C1150 207 1136 212 1120 212 Z"
          fill="url(#cloud)" stroke="url(#cloudEdge)" stroke-width="2"/>
    <text x="800" y="96" text-anchor="middle" class="sans" font-size="13" font-weight="700" letter-spacing="3" fill="#64d2ff">YOUR MAC CLOUD</text>
    <text x="800" y="132" text-anchor="middle" class="sans" font-size="30" font-weight="700" letter-spacing="-.5" fill="#f5f5f7">FluxVM control plane</text>
    <g class="mono" font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">
      <rect x="512" y="150" width="128" height="32" rx="16" fill="#0a84ff"/>
      <text x="576" y="171">fluxctl</text>
      <rect x="652" y="150" width="138" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
      <text x="721" y="171">REST :7788</text>
      <rect x="802" y="150" width="138" height="32" rx="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
      <text x="871" y="171">MCP &#183; agents</text>
      <rect x="952" y="150" width="136" height="32" rx="16" fill="#bf5af2" fill-opacity=".85"/>
      <text x="1020" y="171">fleet :7799</text>
    </g>
  </g>

  <!-- Placement flows: cloud to each Mac's VMs -->
  <path class="wire" stroke="#64d2ff" d="M520 206 C520 250 290 238 290 272"/>
  <path class="wire" stroke="#64d2ff" d="M700 212 C700 240 650 246 650 272"/>
  <path class="wire" stroke="#64d2ff" d="M900 212 C900 240 950 246 950 272"/>
  <path class="wire" stroke="#64d2ff" d="M1080 206 C1080 250 1310 238 1310 272"/>
  <path class="flow" stroke="#64d2ff" d="M520 206 C520 250 290 238 290 272"/>
  <path class="flow" stroke="#64d2ff" d="M700 212 C700 240 650 246 650 272" style="animation-delay:-.3s"/>
  <path class="flow" stroke="#bf5af2" d="M900 212 C900 240 950 246 950 272" style="animation-delay:-.6s"/>
  <path class="flow" stroke="#bf5af2" d="M1080 206 C1080 250 1310 238 1310 272" style="animation-delay:-.9s"/>

  <!-- VM tiles -->
  <!-- 1. macOS guest on Mac Studio A -->
  <g transform="translate(150 292)">
    <g class="bob">
      <rect x="20" y="-20" width="280" height="180" rx="14" fill="#2c2c2e" opacity=".35"/>
      <rect x="10" y="-10" width="280" height="180" rx="14" fill="#2c2c2e" opacity=".6"/>
      <g filter="url(#shadow)">
        <rect width="280" height="180" rx="14" fill="#1c1c1e" stroke="#fff" stroke-opacity=".16"/>
      </g>
      <circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
      <text x="140" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#d1d1d6">macOS 27 guest</text>
      <rect x="236" y="6" width="34" height="18" rx="9" fill="#0a84ff"/>
      <text x="253" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fff">vz</text>
      <rect x="8" y="32" width="264" height="140" rx="8" fill="url(#wall)"/>
      <rect x="8" y="32" width="264" height="9" rx="4" fill="#fff" opacity=".28"/>
      <rect x="26" y="54" width="118" height="70" rx="7" fill="#f5f5f7" opacity=".92"/>
      <rect x="26" y="54" width="34" height="70" rx="7" fill="#d1d1d6"/>
      <circle cx="35" cy="62" r="2.4" fill="#ff5f57"/><circle cx="42" cy="62" r="2.4" fill="#febc2e"/><circle cx="49" cy="62" r="2.4" fill="#28c840"/>
      <rect x="70" y="66" width="18" height="15" rx="3" fill="#64d2ff"/><rect x="96" y="66" width="18" height="15" rx="3" fill="#64d2ff"/><rect x="122" y="66" width="14" height="15" rx="3" fill="#64d2ff"/>
      <rect x="70" y="92" width="18" height="15" rx="3" fill="#64d2ff"/><rect x="96" y="92" width="18" height="15" rx="3" fill="#ffd60a"/>
      <rect x="160" y="62" width="96" height="46" rx="7" fill="#1c1c1e" opacity=".85"/>
      <text x="168" y="80" class="mono" font-size="9.5" fill="#30d158">xcodebuild test</text>
      <text x="168" y="96" class="mono" font-size="9.5" fill="#d1d1d6">TEST SUCCEEDED</text>
      <rect x="76" y="146" width="128" height="20" rx="7" fill="#fff" opacity=".32"/>
      <rect x="84" y="150" width="12" height="12" rx="3" fill="#0a84ff"/><rect x="102" y="150" width="12" height="12" rx="3" fill="#30d158"/>
      <rect x="120" y="150" width="12" height="12" rx="3" fill="#ff9f0a"/><rect x="138" y="150" width="12" height="12" rx="3" fill="#ff375f"/>
      <rect x="156" y="150" width="12" height="12" rx="3" fill="#bf5af2"/><rect x="174" y="150" width="12" height="12" rx="3" fill="#8e8e93"/>
    </g>
  </g>

  <!-- 2. Agent sandbox on Mac mini 1 -->
  <g transform="translate(535 292)">
    <g class="bob b2">
      <rect x="20" y="-20" width="230" height="180" rx="14" fill="#2c2c2e" opacity=".35"/>
      <rect x="10" y="-10" width="230" height="180" rx="14" fill="#2c2c2e" opacity=".6"/>
      <g filter="url(#shadow)"><rect width="230" height="180" rx="14" fill="#1c1c1e" stroke="#fff" stroke-opacity=".16"/></g>
      <circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
      <text x="125" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#d1d1d6">Agent sandbox</text>
      <rect x="186" y="6" width="34" height="18" rx="9" fill="#0a84ff"/>
      <text x="203" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fff">vz</text>
      <rect x="8" y="32" width="214" height="140" rx="8" fill="#0b0b0d"/>
      <g class="mono" font-size="11.5">
        <text x="18" y="56" fill="#30d158">$ <tspan fill="#f5f5f7">fluxctl sandbox create</tspan></text>
        <text x="18" y="76" fill="#8e8e93">  ttl 15m &#183; offline</text>
        <text x="18" y="100" fill="#30d158">$ <tspan fill="#f5f5f7">fluxctl exec sb1 --</tspan></text>
        <text x="18" y="118" fill="#f5f5f7">    make test</text>
        <text x="18" y="142" fill="#30d158">&#10003; 128 passed</text>
        <rect class="cursor" x="18" y="152" width="8" height="13" fill="#f5f5f7"/>
      </g>
    </g>
  </g>

  <!-- 3. Container sandbox on Mac mini 2 -->
  <g transform="translate(835 292)">
    <g class="bob b3">
      <rect x="20" y="-20" width="230" height="180" rx="14" fill="#2c2c2e" opacity=".35"/>
      <rect x="10" y="-10" width="230" height="180" rx="14" fill="#2c2c2e" opacity=".6"/>
      <g filter="url(#shadow)"><rect width="230" height="180" rx="14" fill="#1c1c1e" stroke="#fff" stroke-opacity=".16"/></g>
      <circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
      <text x="122" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#d1d1d6">Container VM</text>
      <rect x="186" y="6" width="34" height="18" rx="9" fill="#0a84ff"/>
      <text x="203" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fff">vz</text>
      <rect x="8" y="32" width="214" height="140" rx="8" fill="#0b0b0d"/>
      <g class="mono" font-size="11.5">
        <text x="18" y="56" fill="#30d158">$ <tspan fill="#f5f5f7">fluxctl sandbox run</tspan></text>
        <text x="18" y="74" fill="#f5f5f7">    alpine:3.22 --rm \</text>
        <text x="18" y="92" fill="#f5f5f7">    -- echo hi</text>
        <text x="18" y="114" fill="#64d2ff">hi</text>
        <text x="18" y="138" fill="#8e8e93">uid 65534 &#183; ro root</text>
        <text x="18" y="156" fill="#8e8e93">one VM per container</text>
      </g>
    </g>
  </g>

  <!-- 4. Debian + Rosetta on Mac Studio B -->
  <g transform="translate(1170 292)">
    <g class="bob b4">
      <rect x="20" y="-20" width="280" height="180" rx="14" fill="#2c2c2e" opacity=".35"/>
      <rect x="10" y="-10" width="280" height="180" rx="14" fill="#2c2c2e" opacity=".6"/>
      <g filter="url(#shadow)"><rect width="280" height="180" rx="14" fill="#1c1c1e" stroke="#fff" stroke-opacity=".16"/></g>
      <circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
      <text x="140" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#d1d1d6">Debian 13 + Rosetta</text>
      <rect x="236" y="6" width="34" height="18" rx="9" fill="#0a84ff"/>
      <text x="253" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fff">vz</text>
      <rect x="8" y="32" width="264" height="140" rx="8" fill="#0b0b0d"/>
      <g class="mono" font-size="11.5">
        <text x="18" y="56" fill="#30d158">velora@ci<tspan fill="#f5f5f7">:~$ uname -m</tspan></text>
        <text x="18" y="74" fill="#f5f5f7">aarch64</text>
        <text x="18" y="98" fill="#30d158">velora@ci<tspan fill="#f5f5f7">:~$ ./tool-amd64</tspan></text>
        <text x="18" y="116" fill="#ffd60a">x86_64 binary via Rosetta</text>
        <text x="18" y="140" fill="#30d158">velora@ci<tspan fill="#f5f5f7">:~$ ls /mnt/src</tspan></text>
        <text x="18" y="158" fill="#64d2ff">virtiofs share from macOS</text>
      </g>
    </g>
  </g>

  <!-- VM to host connectors -->
  <g stroke="#64d2ff" opacity=".55">
    <path class="flow" d="M290 480 V560"/>
    <path class="flow" d="M650 480 V612" style="animation-delay:-.4s"/>
    <path class="flow" d="M950 480 V612" style="animation-delay:-.8s"/>
    <path class="flow" d="M1310 480 V560" style="animation-delay:-.2s"/>
  </g>

  <!-- Shelf -->
  <ellipse cx="800" cy="716" rx="720" ry="26" fill="#0a84ff" opacity=".10" filter="url(#soft)"/>
  <rect x="90" y="710" width="1420" height="6" rx="3" fill="#2c2c2e"/>
  <rect x="90" y="710" width="1420" height="1" fill="#fff" opacity=".18"/>

  <!-- Links between Macs -->
  <path class="link" stroke="url(#tb)" d="M440 650 H540"/>
  <path class="link" stroke="#64d2ff" d="M760 668 H840" style="animation-delay:-.5s"/>
  <path class="link" stroke="url(#tb)" d="M1060 650 H1160" style="animation-delay:-1s"/>
  <g class="mono" font-size="12" font-weight="700" text-anchor="middle">
    <text x="490" y="636" fill="#bf5af2">TB5</text>
    <text x="800" y="654" fill="#64d2ff">10 GbE</text>
    <text x="1110" y="636" fill="#bf5af2">TB5</text>
  </g>

  <!-- Mac Studio A -->
  <g filter="url(#shadow)">
    <rect x="140" y="560" width="300" height="24" rx="11" fill="url(#aluTop)"/>
    <rect x="140" y="570" width="300" height="140" rx="18" fill="url(#alu)"/>
  </g>
  <rect x="160" y="571" width="260" height="2" fill="url(#sheen)"/>
  <rect x="166" y="676" width="20" height="7" rx="3.5" fill="#3a3a3c"/>
  <rect x="194" y="676" width="20" height="7" rx="3.5" fill="#3a3a3c"/>
  <rect x="228" y="678" width="54" height="4" rx="2" fill="#3a3a3c"/>
  <circle class="led" cx="418" cy="690" r="3.2" fill="#30d158"/>

  <!-- Mac mini 1 -->
  <g filter="url(#shadow)">
    <rect x="540" y="612" width="220" height="20" rx="10" fill="url(#aluTop)"/>
    <rect x="540" y="620" width="220" height="90" rx="16" fill="url(#alu)"/>
  </g>
  <rect x="556" y="621" width="188" height="2" fill="url(#sheen)"/>
  <rect x="562" y="682" width="18" height="6" rx="3" fill="#3a3a3c"/>
  <rect x="586" y="682" width="18" height="6" rx="3" fill="#3a3a3c"/>
  <circle cx="616" cy="685" r="3.5" fill="#3a3a3c"/>
  <circle class="led" cx="740" cy="690" r="3" fill="#30d158" style="animation-delay:-.6s"/>

  <!-- Mac mini 2 -->
  <g filter="url(#shadow)">
    <rect x="840" y="612" width="220" height="20" rx="10" fill="url(#aluTop)"/>
    <rect x="840" y="620" width="220" height="90" rx="16" fill="url(#alu)"/>
  </g>
  <rect x="856" y="621" width="188" height="2" fill="url(#sheen)"/>
  <rect x="862" y="682" width="18" height="6" rx="3" fill="#3a3a3c"/>
  <rect x="886" y="682" width="18" height="6" rx="3" fill="#3a3a3c"/>
  <circle cx="916" cy="685" r="3.5" fill="#3a3a3c"/>
  <circle class="led" cx="1040" cy="690" r="3" fill="#30d158" style="animation-delay:-1.2s"/>

  <!-- Mac Studio B -->
  <g filter="url(#shadow)">
    <rect x="1160" y="560" width="300" height="24" rx="11" fill="url(#aluTop)"/>
    <rect x="1160" y="570" width="300" height="140" rx="18" fill="url(#alu)"/>
  </g>
  <rect x="1180" y="571" width="260" height="2" fill="url(#sheen)"/>
  <rect x="1186" y="676" width="20" height="7" rx="3.5" fill="#3a3a3c"/>
  <rect x="1214" y="676" width="20" height="7" rx="3.5" fill="#3a3a3c"/>
  <rect x="1248" y="678" width="54" height="4" rx="2" fill="#3a3a3c"/>
  <circle class="led" cx="1438" cy="690" r="3.2" fill="#30d158" style="animation-delay:-1.8s"/>

  <!-- Labels -->
  <g class="sans" text-anchor="middle">
    <text x="290" y="750" font-size="20" font-weight="600" fill="#f5f5f7">Mac Studio</text>
    <text x="290" y="773" font-size="14" fill="#a1a1a6">M5 Ultra &#183; macOS guests + CI</text>
    <text x="650" y="750" font-size="20" font-weight="600" fill="#f5f5f7">Mac mini</text>
    <text x="650" y="773" font-size="14" fill="#a1a1a6">M6 &#183; agent sandboxes</text>
    <text x="950" y="750" font-size="20" font-weight="600" fill="#f5f5f7">Mac mini</text>
    <text x="950" y="773" font-size="14" fill="#a1a1a6">M5 Pro &#183; container VMs</text>
    <text x="1310" y="750" font-size="20" font-weight="600" fill="#f5f5f7">Mac Studio</text>
    <text x="1310" y="773" font-size="14" fill="#a1a1a6">M5 Max &#183; Linux VMs</text>
  </g>

  <!-- Footer -->
  <rect x="300" y="806" width="1000" height="44" rx="22" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
  <text x="800" y="834" text-anchor="middle" class="sans" font-size="17" fill="#d1d1d6"><tspan fill="#0a84ff" font-weight="700">vz</tspan> backend  &#183;  Apple Virtualization.framework  &#183;  one signed runner per VM  &#183;  APFS clones  &#183;  ~2 s warm starts</text>
  <text x="800" y="880" text-anchor="middle" class="sans" font-size="12.5" fill="#6e6e73">Illustration, not Apple artwork. Measured on one Apple M4 with macOS 27.2; multi-Mac fleets are not yet verified on hardware.</text>
</svg>
