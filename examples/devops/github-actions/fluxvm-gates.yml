name: fluxvm-devops-gates

on:
  workflow_call:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract + example tests
        working-directory: examples/devops
        run: python3 -m unittest test_contract.py test_examples.py -v
      - name: Offline gates
        run: |
          bash scripts/test-devops-gate.sh
          bash scripts/test-upgrade-snapshot.sh
