[package]
name = "fluxvm-intelligence"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "VM-aware eBPF runtime intelligence for Zyvor FluxVM"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-network = { path = "../fluxvm-network" }
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
