[package]
name = "fluxvm-cli"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Zyvor FluxVM command-line interface"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-scheduler = { path = "../fluxvm-scheduler" }
fluxvm-api = { path = "../fluxvm-api" }
fluxvm-image = { path = "../fluxvm-image" }
fluxvm-network = { path = "../fluxvm-network" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "fluxvm"
path = "src/main.rs"
