[package]
name = "fluxvm-cli"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Zyvor FluxVM command-line interface"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-scheduler = { path = "../fluxvm-scheduler" }
fluxvm-api = { path = "../fluxvm-api" }
fluxvm-image = { path = "../fluxvm-image" }
fluxvm-network = { path = "../fluxvm-network" }
fluxvm-intelligence = { path = "../fluxvm-intelligence" }
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
fluxvm-agent = { path = "../fluxvm-agent" }
tempfile = "3"

[[bin]]
name = "fluxvm"
path = "src/main.rs"
