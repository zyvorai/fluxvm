[package]
name = "fluxvm-qemu"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "QEMU/KVM VmBackend implementation for Zyvor FluxVM"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
