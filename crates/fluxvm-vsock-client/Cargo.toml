description = "Host-side dialing for the Zyvor FluxVM guest agent over AF_VSOCK"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
