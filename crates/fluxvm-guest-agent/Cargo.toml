[package]
name = "fluxvm-guest-agent"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "In-guest AF_VSOCK agent for Zyvor FluxVM (ping/exec/put-file/get-file/shutdown, no SSH needed)"

[dependencies]
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fluxvm-guest-agent"
path = "src/main.rs"
