[package]
name = "fluxvm-storage"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "VM-record state persistence for Zyvor FluxVM"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
anyhow = "1"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
