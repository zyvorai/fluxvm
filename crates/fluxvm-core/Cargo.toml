[package]
name = "fluxvm-core"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared domain types, config, and VmBackend trait for Zyvor FluxVM"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
fluxvm-cgroup = { path = "../fluxvm-cgroup" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
