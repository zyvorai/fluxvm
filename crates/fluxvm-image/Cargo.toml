[package]
name = "fluxvm-image"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Image build/clone and cloud-init seed generation for Zyvor FluxVM"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
guestkit = { path = "../../../guestkit", features = ["registry-write", "agent"] }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
