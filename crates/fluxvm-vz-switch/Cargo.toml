[package]
name = "fluxvm-vz-switch"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Userspace Ethernet switch for private networks between FluxVM vz guests"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fluxvm-vz-switch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
