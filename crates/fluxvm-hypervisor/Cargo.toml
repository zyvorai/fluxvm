[package]
name = "fluxvm-hypervisor"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Zyvor FluxVM lightweight KVM microVMM (one VM per process)"

[[bin]]
name = "fluxvm-hypervisor"
path = "src/main.rs"

[lib]
name = "fluxvm_hypervisor"
path = "src/lib.rs"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.4"
