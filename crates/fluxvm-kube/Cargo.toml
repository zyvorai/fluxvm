[package]
name = "fluxvm-kube"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "DisposableVM CRD + node-local operator for Zyvor FluxVM"

[[bin]]
name = "fluxvm-kube"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.24", features = ["v1_31"] }
kube = { version = "0.99", features = ["runtime", "derive", "client", "rustls-tls"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
