[package]
name = "fluxvm-cloud-hypervisor"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Cloud Hypervisor VmBackend implementation for Zyvor FluxVM"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
chrono = "0.4"
