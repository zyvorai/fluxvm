apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluxvm-networkpolicy-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fluxvm-networkpolicy-controller
    app.kubernetes.io/part-of: fluxvm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxvm-networkpolicy-controller
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxvm-networkpolicy-controller
        app.kubernetes.io/part-of: fluxvm
    spec:
      serviceAccountName: fluxvm-networkpolicy-controller
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
        - name: controller
          image: ghcr.io/zyvorai/fluxvm-networkpolicy-controller:v0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --node-name=$(NODE_NAME)
            - --fluxvm-url=http://127.0.0.1:7788
            - --interval=5s
            - --max-addresses=12000
            - --max-rules=64
            - --metrics-listen=:9090
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9090
              hostPort: 19090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      # If FluxVM API authentication is enabled, mount a token Secret and add:
      #   --fluxvm-token-file=/var/run/secrets/fluxvm/token
      # to args. No host filesystem or privileged mount is otherwise required.
