apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxvm-networkpolicy-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluxvm-networkpolicy-controller
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services"]
    verbs: ["get", "list"]
  # FLUXVM_SECURE_CONTAINERS_SET18: required only when
  # --include-service-clusterips is enabled; discovery/v1 EndpointSlices are
  # the Service backend routing source of truth.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluxvm-networkpolicy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluxvm-networkpolicy-controller
subjects:
  - kind: ServiceAccount
    name: fluxvm-networkpolicy-controller
    namespace: kube-system
