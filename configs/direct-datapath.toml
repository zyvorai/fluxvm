#
# Host profile fragment for the direct (bridge-less) datapath -- docs/direct-datapath.md.
#
# The redirect between a VM's tap and its outer device is installed by the eBPF dataplane and is the
# ONLY forwarding path for a direct VM (there is no bridge to fall back on), so the daemon needs a
# native dataplane mode; `legacy` is rejected at create time and a failed attach is fatal.
#
# Two ways to use it:
#   * Secure Containers on Cilium/any veth CNI: keep configs/cilium-cni.toml (mode = "cilium") and set
#       FLUXVM_CONTAINER_CNI_DATAPATH=auto     # auto (default) | direct | bridge   -- shim env, per node
#   * Standalone VMs on a physical uplink: keep this fragment and create VMs with
#       "network": {"mode": "tap", "mac": "...",
#                   "direct": {"outer": "enp1s0", "mode": "l2-uplink", "guest_ips": ["192.168.1.50"]}}
#     (the uplink must be an unenslaved NIC, not a bridge/bond port)
#
# Objects required in /usr/lib/fluxvm/bpf: fluxvm_tc.bpf.o and fluxvm_direct.bpf.o
# (scripts/build-ebpf.sh, scripts/enable-network-fabric-ga.sh). For TCX attach also install the
# helper /usr/libexec/fluxvm/fluxvm-tcx (scripts/build-runtime-intelligence.sh); without it
# FLUXVM_TCX=auto quietly uses legacy clsact/tc.
#
#   sudo ./scripts/test-direct-datapath.sh
#   ./scripts/evidence-direct-datapath.sh

[sandbox.dataplane]
mode = "ebpf"
bpf_object = "/usr/lib/fluxvm/bpf/fluxvm_tc.bpf.o"
pin_root = "/sys/fs/bpf/fluxvm"
required = true
